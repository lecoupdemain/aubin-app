<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aubin – le jeu qui t'aide à tenir</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffe9b8;--cd:#fffaf0;--tx:#1d2340;--mu:#5d6585;--ac:#ff6b6b;--gr:#2ec4a6;--gd:#ffc93c;--sk:#bfe6ff;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#1a1f45;--cd:#262d63;--tx:#fff6dd;--mu:#b5bce6;--sk:#33408a}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:500 16px/1.45 Fredoka,system-ui,sans-serif;padding-bottom:88px}
h1,h2,h3{margin:0 0 .35em;font-weight:700}
main{max-width:600px;margin:0 auto;padding:14px}
.c{background:var(--cd);border:3px solid var(--tx);border-radius:22px;padding:14px;margin-bottom:14px;box-shadow:0 5px 0 var(--tx)}
.mu{color:var(--mu);font-size:14px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button,.b{
  font:inherit;font-weight:700;border:3px solid var(--tx);border-radius:16px;padding:11px 14px;
  cursor:pointer;background:var(--gr);color:var(--tx);text-decoration:none;display:inline-block;
  text-align:center;box-shadow:0 4px 0 var(--tx);transition:transform .08s,box-shadow .08s
}
button:active,.b:active{transform:translateY(4px);box-shadow:0 0 0 var(--tx)}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.s{background:var(--cd)}.w{background:var(--gd)}.r{background:var(--ac)}.f{width:100%}
button:disabled{opacity:.45;cursor:not-allowed}
input,textarea{font:inherit;width:100%;padding:10px;border-radius:12px;border:3px solid var(--tx);background:var(--cd);color:var(--tx)}
label{display:block;font-weight:700;margin:10px 0 4px}
.chip{padding:6px 12px;border-radius:99px;box-shadow:none;background:var(--cd)}
.chip.on{background:var(--gd)}
.bar{height:16px;background:var(--cd);border:3px solid var(--tx);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gd);transition:width .4s}
.bar.hp i{background:var(--ac)}
nav{
  position:fixed;left:0;right:0;bottom:0;background:var(--cd);border-top:3px solid var(--tx);
  display:flex;justify-content:space-around;padding:6px 2px calc(6px + env(safe-area-inset-bottom,0px));z-index:5
}
nav button{background:none;border:0;box-shadow:none;font-size:10px;padding:4px 2px;color:var(--mu)}
nav button.on{color:var(--tx);background:var(--gd);border-radius:14px}
nav span{display:block;font-size:19px}
#m{position:fixed;inset:0;background:rgba(10,12,35,.8);display:none;align-items:center;justify-content:center;padding:16px;z-index:9;overflow:auto}
#m>div{background:var(--cd);border:3px solid var(--tx);border-radius:24px;padding:18px;max-width:460px;width:100%;max-height:92vh;overflow:auto}
#t{
  position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);
  background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:14px;z-index:11;display:none;
  font-weight:700;max-width:92vw;text-align:center
}
.hero{background:linear-gradient(var(--sk),var(--cd));text-align:center;position:relative;overflow:hidden}
.av{font-size:92px;line-height:1.1;display:inline-block;position:relative;cursor:pointer;animation:bn 2s infinite ease-in-out;user-select:none}
.av .hat{position:absolute;top:-26px;left:50%;transform:translateX(-50%) rotate(-8deg);font-size:48px}
.av .fc{position:absolute;top:34%;left:50%;transform:translateX(-50%);font-size:50px}
@keyframes bn{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.say{background:var(--cd);border:3px solid var(--tx);border-radius:16px;padding:8px 12px;display:inline-block;max-width:92%;margin-top:6px}
.ritual{display:flex;gap:10px;align-items:center;padding:10px;border:3px solid var(--tx);border-radius:16px;margin-bottom:8px;cursor:pointer;background:var(--cd)}
.ritual.d{background:var(--gr)}
.ritual.d span{text-decoration:line-through}
.warn{background:#ffd6d6;color:#1d2340;border:3px solid var(--tx);border-radius:14px;padding:10px;margin:10px 0}
.warn a{color:#a10f2e}
.map{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.cell{aspect-ratio:1;border:3px solid var(--tx);border-radius:12px;display:grid;place-items:center;font-size:19px;background:var(--cd)}
.cell.ok{background:var(--gr)}
.cell.cur{background:var(--gd);animation:bn 1.4s infinite}
.mon{font-size:84px;text-align:center;animation:sh .6s infinite}
@keyframes sh{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.cf{position:fixed;top:-30px;font-size:26px;z-index:12;pointer-events:none;animation:fl 1.8s forwards ease-in}
@keyframes fl{to{transform:translateY(110vh) rotate(540deg);opacity:.2}}
@media(prefers-reduced-motion:reduce){.av,.cell.cur,.mon,.cf{animation:none}}
</style>
</head>
<body>
<div id="t" role="status" aria-live="polite"></div>
<main id="app"></main>
<div id="m"></div>
<nav id="nav" aria-label="Navigation principale"></nav>

<script>
const K='aubin_v3',$=s=>document.querySelector(s);
let S=null;
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const dk=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');

const TR=['Fatigue','Stress','Ennui','Solitude','Dispute','Apéro','Habitude','Fête'];
const STG=[[0,'🥚','Œuf'],[1,'🐣','Poussin'],[3,'🐥','Petit courageux'],[7,'🦊','Renard malin'],[14,'🦁','Lion'],[30,'🐉','Dragon'],[90,'🦄','Licorne légendaire']];
const DEFI=[
  'Envoie un message sympa à un proche',
  'Prépare une boisson fraîche sans alcool avec du citron',
  'Écoute ta chanson préférée en entier',
  'Range un tiroir ou un coin de bureau pendant cinq minutes',
  'Fais dix squats ou quinze secondes de gainage',
  'Sors prendre l’air trois minutes',
  'Note trois petites choses positives de ta semaine',
  'Fais-toi une tisane ou un thé bien chaud'
];
const ITEMS=[
  ['h1','🎩','Chapeau',50,'hat'],
  ['h2','👑','Couronne',200,'hat'],
  ['h3','🎀','Ruban',60,'hat'],
  ['f1','🕶️','Lunettes',80,'fc'],
  ['f2','🎧','Casque',100,'fc'],
  ['f3','🥸','Déguisement',120,'fc']
];
const MOCK=[
  'Mojito royal : eau pétillante, citron vert, feuilles de menthe, glaçons.',
  'Ginger kick : ginger beer sans alcool, rondelle d’orange, brin de romarin.',
  'Spritz rubis : jus de grenade, eau pétillante, rondelle de pamplemousse.'
];
const GAGES=[
  'Bois deux grands verres d’eau tout de suite pour réhydrater ton corps.',
  'Fais quinze squats tranquillement à ton rythme pour relancer l’énergie.',
  'Range un tiroir ou débarrasse la table pendant quatre minutes chrono.',
  'Envoie un message honnête à une personne de confiance.',
  'Fais cinq minutes d’étirements du dos, de la nuque et des épaules.'
];
const ACT=[
  ['🌬️','Trois grandes respirations (inspire quatre secondes, expire six secondes)'],
  ['💧','Boire un grand verre d’eau'],
  ['👀','Cinq, quatre, trois, deux, un : nomme cinq choses que tu vois'],
  ['🚶','Bouger deux minutes'],
  ['📱','Écrire un mot à quelqu’un'],
  ['❤️','Relire ta raison']
];
const HEALTH=[
  [24,'24 h','L’alcool a quitté le sang. En cas de consommation quotidienne importante, un suivi médical reste indispensable.'],
  [72,'3 jours','Le sevrage physique est souvent marqué entre vingt-quatre et soixante-douze heures. Reste entouré.'],
  [168,'1 semaine','Le sommeil et le réveil s’améliorent souvent dès la première semaine.'],
  [336,'2 semaines','La digestion, l’hydratation et le niveau d’énergie progressent généralement.'],
  [720,'1 mois','La stéatose hépatique diminue souvent nettement en quelques semaines sans alcool.'],
  [2160,'3 mois','L’humeur, la tension et la clarté mentale gagnent en stabilité chez de nombreuses personnes.']
];
const TROPH=[
  ['🌅','Jour 1',s=>s.days>=1],
  ['🛡️','3 jours',s=>s.days>=3],
  ['🏆','7 jours',s=>s.days>=7],
  ['🌳','14 jours',s=>s.days>=14],
  ['🐉','30 jours',s=>s.days>=30],
  ['⚔️','5 envies surmontées',()=>S.cr.filter(c=>c.ok).length>=5],
  ['🌙','7 bilans du soir',()=>Object.values(S.logs).filter(l=>l.chk).length>=7],
  ['💙','Honnête après un écart',()=>S.slips>=1]
];
const SP={
  doux:[
    ['☀️','Repos actif du dimanche','Balade tranquille ou repos complet sans alcool. Les week-ends sobres permettent de vrais matins légers.',10],
    ['🚶','Marche tranquille (Lundi)','Quinze minutes à un rythme où tu peux parler facilement, suivies de cinq respirations lentes.',15],
    ['🧘','Étirements & souffle (Mardi)','Dix minutes pour la nuque, les épaules, le dos et les jambes en respirant calmement.',10],
    ['🪑','Renfort doux (Mercredi)','Deux séries de huit répétitions : lever de chaise, pompes contre un mur, ponts fessiers.',12],
    ['🌳','Marche dehors (Jeudi)','Vingt minutes à l’extérieur en observant l’environnement, sans téléphone en main.',20],
    ['💃','Mobilité & rythme (Vendredi)','Douze minutes de mouvement libre ou de marche dynamique pour clôturer la semaine.',12],
    ['☀️','Repos actif du samedi','Balade légère ou détente : ton corps récupère mieux sans fatigue liée à l’alcool.',10]
  ],
  actif:[
    ['☀️','Repos actif du dimanche','Récupération active : marche douce ou étirements pour garder l’élan sans surcharge.',10],
    ['🏃','Cardio fractionné (Lundi)','Vingt minutes : alterne deux minutes de marche rapide ou footing léger et une minute de marche lente.',20],
    ['🏋️','Renforcement musculaire (Mardi)','Trois séries de dix squats, huit pompes (sur les genoux si besoin) et vingt secondes de gainage.',20],
    ['🚶','Marche soutenue (Mercredi)','Trente minutes à un rythme dynamique qui sollicite le souffle.',30],
    ['🔁','Circuit complet (Jeudi)','Trois tours : dix squats, huit pompes, trente secondes de gainage, trente secondes de jumping jacks.',20],
    ['🚴','Cardio au choix (Vendredi)','Vingt-cinq minutes de vélo, natation, corde à sauter ou marche rapide.',25],
    ['☀️','Repos actif du samedi','Balade tranquille ou étirements : le corps consolide les progrès du lundi au vendredi.',10]
  ]
};
const OCC=[
  ['🖐️ Mains','Cuisine quelque chose de simple','Range un tiroir ou une étagère','Dessine ou gribouille cinq minutes','Puzzle ou petit jeu de logique'],
  ['🏃 Corps','Marche dix minutes dehors','Vingt squats ou dix pompes','Prends une douche tiède ou fraîche','Étire ton dos et tes épaules'],
  ['🧠 Tête','Appelle quelqu’un, même deux minutes','Écris pourquoi tu veux tenir','Mots croisés, sudoku ou lecture','Regarde une vidéo drôle'],
  ['🥤 Bouche','Prépare une boisson fraîche sans alcool','Fais-toi une tisane ou un thé','Eau pétillante et citron vert','Croque une pomme ou un fruit']
];

let tab='home',B=null,bt=null,cur={tr:null,md:3,amt:null,gage:null};
let occT=null,spT=null,spLeft=null;
let tk={r:'',c:false,l:false},cs=dk(),dl=false,DI=null,rec=null;

const R=()=>[
  ['eau','💧','Boire huit verres d’eau',30],
  ['mov','💪','Mon sport du jour (onglet Sport)',40],
  ['rep','🍽️','Faire un vrai repas',30],
  ['soc','📞','Parler à quelqu’un de confiance',40],
  ['def','🎲','Défi du jour : '+DEFI[new Date().getDate()%DEFI.length],50],
  ['chk','🌙','Bilan du soir',50]
];
const T=()=>S.logs[dk()]||(S.logs[dk()]={d:[],water:0});
const stat=()=>{
  const raw=Date.now()-S.start,ms=Math.max(0,raw),h=ms/36e5;
  return{
    pre:raw<0,left:-raw,ms,h,
    days:Math.floor(h/24),
    sober:Object.values(S.logs).filter(l=>l.drank===false).length,
    saved:ms/864e5*S.cost
  };
};
const stage=d=>[...STG].reverse().find(s=>d>=s[0]);

function toast(m){
  const t=$('#t');t.textContent=m;t.style.display='block';
  clearTimeout(toast.i);toast.i=setTimeout(()=>t.style.display='none',3000);
}
function boom(){
  for(let i=0;i<24;i++){
    const e=document.createElement('div');e.className='cf';
    e.textContent=rnd(['🎉','⭐','🪙','✨','🎊']);
    e.style.left=Math.random()*95+'vw';e.style.animationDelay=Math.random()*.5+'s';
    document.body.appendChild(e);setTimeout(()=>e.remove(),2400);
  }
}
function xp(n,m){
  const g=Math.round(n/4);
  S.xp+=n;S.gold+=g;save();
  toast('+'+n+' XP · +'+g+' pièces · '+m);render();
}
function modal(h){$('#m').innerHTML='<div role="dialog">'+h+'</div>';$('#m').style.display='flex'}
function close(){clearInterval(occT);$('#m').style.display='none';render()}

function avatar(){
  const s=stat(),st=stage(s.days),w=S.worn||{},it=id=>ITEMS.find(i=>i[0]==id)?.[1]||'';
  return`<div class="av" data-a="talk">${st[1]}${w.hat?`<span class="hat">${it(w.hat)}</span>`:''}${w.fc?`<span class="fc">${it(w.fc)}</span>`:''}</div>`;
}
function say(){
  const s=stat(),t=T(),n=t.d.length,L=[];
  if(n===0)L.push('Salut '+(S.name||'toi')+' ! On lance une petite quête pour démarrer ?');
  if(n>=3)L.push('Beau rythme aujourd’hui, tu avances bien.');
  if(s.days>=3)L.push(s.days+' jours d’affilée : chaque journée compte.');
  L.push(
    'Une envie passe souvent en quelques minutes quand on change d’action.',
    'Pas de jugement ici : on avance un jour à la fois.',
    'Clique sur moi si tu veux un petit mot d’encouragement.'
  );
  return rnd(L);
}

function render(){
  if(!S){$('#nav').style.display='none';return $('#app').innerHTML=onboard()}
  $('#nav').style.display='flex';
  $('#nav').innerHTML=[
    ['home','🏠','Aubin'],
    ['map','🗺️','Aventure'],
    ['sos','⚔️','Envie'],
    ['shop','🛍️','Boutique'],
    ['sport','💪','Sport/Détox'],
    ['talk','💬','Parler'],
    ['me','🧭','Moi']
  ].map(n=>`<button class="${tab==n[0]?'on':''}" data-a="tab" data-v="${n[0]}"><span>${n[1]}</span>${n[2]}</button>`).join('');
  $('#app').innerHTML={home,map,sos,shop,sport,talk,me}[tab]();
}

function onboard(){
  return`<div class="c hero">
    <div class="av" style="animation-duration:1.4s">🥚</div>
    <h1>Aubin, le jeu qui t’aide à tenir</h1>
    <p>Fais grandir ton compagnon, traverse les envies et cumule tes jours sobres. Un jour à la fois.</p>
  </div>
  <div class="c">
    <label for="nm">Ton prénom</label><input id="nm" placeholder="Ex : Julien">
    <p class="mu">Inutile de tout compter au verre près : les habitudes varient selon les moments.</p>
    <label for="co">Dépense moyenne par semaine (€, facultatif)</label><input id="co" type="number" min="0" placeholder="Laisse vide si tu préfères">
    <label for="rs">Ta raison principale</label><textarea id="rs" rows="2" placeholder="Ex : mieux dormir, garder mon énergie"></textarea>
    <label for="ms">Message d’un proche (facultatif)</label><textarea id="ms" rows="2" placeholder="Ex : Je suis là avec toi."></textarea>
    <label for="qd">Date de départ ou d’arrêt</label><input id="qd" type="date" value="${dk()}">
    <div class="warn">
      <b>Sécurité médicale.</b> En cas de consommation quotidienne importante, un arrêt brutal peut être risqué. Coche ce qui s’est déjà produit :
      <label style="font-weight:400"><input type="checkbox" class="sx" style="width:auto"> Tremblements, sueurs ou nausées sans alcool</label>
      <label style="font-weight:400"><input type="checkbox" class="sx" style="width:auto"> Consommation dès le matin</label>
      <label style="font-weight:400"><input type="checkbox" class="sx" style="width:auto"> Convulsions ou confusion lors d’un arrêt passé</label>
      <div id="wr" style="display:none;margin-top:8px">
        <b>Demande un avis médical avant d’arrêter seul.</b> Contacte ton médecin ou <a href="tel:0980980930">Alcool Info Service (09 80 98 09 30)</a>. En cas d’urgence : <a href="tel:15">15</a> ou <a href="tel:112">112</a>.
      </div>
    </div>
    <button class="f w" data-a="start">🐣 Faire éclore mon compagnon</button>
    <p class="mu">Données enregistrées localement sur cet appareil. Ne remplace pas un suivi médical.</p>
  </div>`;
}

function home(){
  const s=stat(),st=stage(s.days),L=Math.floor(S.xp/200)+1,t=T(),rit=R(),dn=rit.filter(r=>t.d.includes(r[0])).length,all=dn===rit.length;
  return`
  ${s.pre?`<div class="c" style="background:var(--gd);color:#1d2340">
    <h3>📅 Jour J dans ${Math.ceil(s.left/864e5)} jour${s.left>864e5*1.01?'s':''}</h3>
    <p>Prévu le ${new Date(S.start).toLocaleDateString('fr-FR')}. Tu peux déjà préparer tes boissons sans alcool, tes occupations et tes repères.</p>
  </div>`:''}
  <div class="row" style="margin-bottom:10px"><b>Niv. ${L}</b><b>🔥 ${s.days} j</b><b>🪙 ${S.gold}</b><b>🛡️ ${S.shield}</b></div>
  <div class="c hero">
    <div class="mu">${st[2]}</div>
    ${avatar()}<br>
    <div class="say" id="say">${esc(say())}</div>
    <div class="bar" style="margin:12px 0 4px"><i style="width:${S.xp%200/2}%"></i></div>
    <div class="mu">${S.xp%200}/200 XP vers le niveau ${L+1}</div>
  </div>
  ${S.msg?`<div class="c" style="background:var(--gd);color:#1d2340">💌 <b>Mot d’un proche</b><br>${esc(S.msg)}</div>`:''}
  <div class="g">
    ${S.cost>0
      ?`<div class="c"><b style="font-size:22px">${s.saved.toFixed(0)} €</b><div class="mu">économisés (estimation)</div></div>`
      :`<div class="c"><b style="font-size:22px">${Math.floor(s.h)} h</b><div class="mu">sans alcool</div></div>`}
    <div class="c"><b style="font-size:22px">${s.sober}</b><div class="mu">jours sobres cumulés</div></div>
  </div>
  <div class="c">
    <div class="row"><h3>Quêtes du jour</h3><span class="mu">${dn}/${rit.length}</span></div>
    ${rit.map(r=>`<div class="ritual ${t.d.includes(r[0])?'d':''}" data-a="rit" data-v="${r[0]}"><span>${r[1]} ${esc(r[2])}</span><b style="margin-left:auto">+${r[3]}</b></div>`).join('')}
    ${all&&!t.chest
      ?'<button class="f w" data-a="chest">🎁 Ouvrir mon coffre du jour</button>'
      :all?'<p class="mu">Coffre ouvert aujourd’hui. À demain pour la suite.</p>'
      :'<p class="mu">Valide toutes les quêtes pour ouvrir un coffre.</p>'}
  </div>
  ${S.habits.length?`<div class="c"><h3>🔁 Mes alternatives prévues</h3>${S.habits.map((h,i)=>`<div class="ritual ${t.h&&t.h.includes(i)?'d':''}" data-a="hab" data-v="${i}"><span>Quand ${esc(h.w)} → <b>${esc(h.t)}</b></span><b style="margin-left:auto">+30</b></div>`).join('')}</div>`:''}
  <div class="g">
    <button class="r" data-a="tab" data-v="sos">⚔️ J’ai une envie</button>
    <button class="s" data-a="slip">😅 J’ai déconné / écart</button>
  </div>`;
}

function map(){
  const s=stat(),p=Math.min(30,s.days),M={3:1,7:1,14:1,21:1,30:1};
  return`
  <div class="c">
    <h2>🗺️ Parcours sur trente jours</h2>
    <p class="mu">Chaque jour sobre fait avancer ton compagnon. Les cases 🎁 marquent des étapes clés.</p>
    <div class="map">${[...Array(30)].map((_,i)=>{
      const n=i+1,ok=n<=p,cu=n===p+1;
      return`<div class="cell ${ok?'ok':''} ${cu?'cur':''}">${cu?stage(s.days)[1]:M[n]?'🎁':ok?'✓':n}</div>`;
    }).join('')}</div>
    ${s.days>=30?'<p><b>Trente jours atteints :</b> beau cap franchi, continue à ton rythme.</p>':''}
  </div>
  <div class="c">
    <h3>🛡️ Bouclier seconde chance</h3>
    <p class="mu">Stock actuel : ${S.shield} (maximum deux). Un bouclier protège ta série en cas d’écart ; tu en gagnes un tous les sept jours.</p>
  </div>
  <div class="c">

  tr(v,el){cur.tr=v;el.parentNode.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===el))},
  fight(){
    B={hp:100,used:[]};
    bt=setInterval(()=>{
      if(!B)return;
      B.hp=Math.max(0,B.hp-1);
      const e=$('#hp');if(e)e.style.width=B.hp+'%';
      if(B.hp<=0)A.win();
    },6000);
    render();
  },
  hit(v){
    if(!B||B.used.includes(+v))return;
    B.used.push(+v);B.hp=Math.max(0,B.hp-20);
    if(B.hp<=0)A.win();else render();
  },
  win(){
    clearInterval(bt);B=null;S.cr.push({tr:cur.tr,ok:true});cur.tr=null;cur.gage=null;boom();
    xp(60,'envie traversée');
    modal('<div class="mon">🏆</div><h2>Cap passé</h2><p>L’envie a baissé et tu as tenu. +60 XP.</p><button class="f w" data-a="close">Continuer</button>');
  },
  slipok(v){
    const s=stat(),t=T();
    t.drank=true;t.amt=cur.amt||null;cur.amt=null;
    S.cr.push({tr:cur.tr,ok:false});cur.tr=null;cur.gage=null;S.slips++;B=null;
    if(v==='1'){S.shield=Math.max(0,S.shield-1);S.xp+=40;toast('Bouclier utilisé et gage noté (+40 XP) 🛡️')}
    else{S.best=Math.max(S.best,s.days);S.start=Date.now();S.xp+=40;toast('Nouveau départ noté (+40 XP)')}
    save();close();
  },
  buy(v){
    const i=ITEMS.find(x=>x[0]===v);
    if(!S.items.includes(v)){
      if(S.gold<i[3])return toast('Il manque des pièces pour cet article.');
      S.gold-=i[3];S.items.push(v);boom();
    }
    S.worn[i[4]]=(S.worn[i[4]]===v)?null:v;
    save();render();
  },
  addr(){const v=$('#nr').value.trim();if(v){S.reasons.push(v);save();render()}},
  delr(v){S.reasons.splice(+v,1);save();render()},
  addc(){const n=$('#cn').value.trim(),t=$('#ct').value.trim();if(n&&t){S.contacts.push({n,t});save();render()}},
  delc(v){S.contacts.splice(+v,1);save();render()},
  sum(){
    const s=stat();
    const x=`Suivi Aubin : ${s.sober} jours sobres cumulés, série actuelle ${s.days} j, ${S.slips} écart(s) noté(s), ${S.cr.filter(c=>c.ok).length} envie(s) traversée(s).`;
    try{navigator.clipboard.writeText(x).then(()=>toast('Résumé copié'),()=>toast(x))}catch(e){toast(x)}
  },
  reset(){
    modal('<h2>Tout effacer ?</h2><p>Les données enregistrées sur cet appareil seront supprimées.</p><button class="r f" data-a="reset2">Confirmer l’effacement</button><button class="s f" style="margin-top:8px" data-a="close">Annuler</button>');
  },
  reset2(){try{localStorage.removeItem(K)}catch(e){}S=null;close()}
};

document.addEventListener('click',e=>{
  const a=e.target.closest('[data-a]');
  if(a&&A[a.dataset.a])A[a.dataset.a](a.dataset.v,a);
});
document.addEventListener('change',e=>{
  if(e.target.classList.contains('sx'))$('#wr').style.display=[...document.querySelectorAll('.sx')].some(c=>c.checked)?'block':'none';
});
if(S){
  S.habits=S.habits||[];S.notes=S.notes||[];S.lvl=S.lvl||'doux';
  const s=stat(),g=Math.floor(s.days/7);
  if(g>(S.lastSh||0)){S.shield=Math.min(2,S.shield+g-(S.lastSh||0));S.lastSh=g;save()}
}
render();
</script>
</body>
</html>
