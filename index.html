<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aubin – le jeu qui t'aide à tenir</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffe9b8;--cd:#fffaf0;--tx:#1d2340;--mu:#5d6585;--ac:#ff6b6b;--gr:#2ec4a6;--gd:#ffc93c;--sk:#bfe6ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1f45;--cd:#262d63;--tx:#fff6dd;--mu:#b5bce6;--sk:#33408a}}
:root[data-theme="dark"]{--bg:#1a1f45;--cd:#262d63;--tx:#fff6dd;--mu:#b5bce6;--sk:#33408a}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:500 16px/1.45 Fredoka,system-ui,sans-serif;padding-bottom:92px}
h1,h2,h3{margin:0 0 .3em;font-weight:700}
main{max-width:600px;margin:0 auto;padding:14px}
.c{background:var(--cd);border:3px solid var(--tx);border-radius:22px;padding:14px;margin-bottom:14px;box-shadow:0 5px 0 var(--tx)}
.mu{color:var(--mu);font-size:14px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
button,.b{font:inherit;font-weight:700;border:3px solid var(--tx);border-radius:16px;padding:11px 14px;cursor:pointer;background:var(--gr);color:var(--tx);text-decoration:none;display:inline-block;text-align:center;box-shadow:0 4px 0 var(--tx);transition:transform .08s,box-shadow .08s}
button:active,.b:active{transform:translateY(4px);box-shadow:0 0 0 var(--tx)}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.s{background:var(--cd)}.w{background:var(--gd)}.r{background:var(--ac);color:#1d2340}.f{width:100%}button:disabled{opacity:.45;cursor:not-allowed}
input,textarea{font:inherit;width:100%;padding:10px;border-radius:12px;border:3px solid var(--tx);background:var(--cd);color:var(--tx)}
label{display:block;font-weight:700;margin:10px 0 4px}
.chip{padding:6px 12px;border-radius:99px;box-shadow:none;background:var(--cd);font-size:14px}.chip.on{background:var(--gd);color:#1d2340}
.bar{height:16px;background:var(--cd);border:3px solid var(--tx);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gd);transition:width .4s}.bar.hp i{background:var(--ac)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--cd);border-top:3px solid var(--tx);display:flex;justify-content:space-around;padding:6px 2px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{background:none;border:0;box-shadow:none;font-size:10px;padding:4px 2px;color:var(--mu)}nav button.on{color:#1d2340;background:var(--gd);border-radius:14px}nav span{display:block;font-size:20px}
#m{position:fixed;inset:0;background:rgba(10,12,35,.8);display:none;align-items:center;justify-content:center;padding:16px;z-index:9;overflow:auto}
#m>div{background:var(--cd);border:3px solid var(--tx);border-radius:24px;padding:18px;max-width:460px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 6px 0 var(--tx)}
#t{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:14px;z-index:11;display:none;font-weight:700;max-width:92vw;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.hero{background:linear-gradient(var(--sk),var(--cd));text-align:center;position:relative;overflow:hidden}
.av{font-size:96px;line-height:1.1;display:inline-block;position:relative;cursor:pointer;animation:bn 2s infinite ease-in-out;user-select:none}
.av .hat{position:absolute;top:-26px;left:50%;transform:translateX(-50%) rotate(-8deg);font-size:50px}.av .fc{position:absolute;top:34%;left:50%;transform:translateX(-50%);font-size:52px}
@keyframes bn{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.say{background:var(--cd);border:3px solid var(--tx);border-radius:16px;padding:8px 12px;display:inline-block;max-width:92%;margin-top:6px}
.ritual{display:flex;gap:10px;align-items:center;padding:10px;border:3px solid var(--tx);border-radius:16px;margin-bottom:8px;cursor:pointer;background:var(--cd)}
.ritual.d{background:var(--gr);color:#1d2340}.ritual.d span{text-decoration:line-through}
.warn{background:#ffd6d6;color:#1d2340;border:3px solid var(--tx);border-radius:14px;padding:10px;margin:10px 0}.warn a{color:#a10f2e;font-weight:700}
.map{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.cell{aspect-ratio:1;border:3px solid var(--tx);border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--cd)}.cell.ok{background:var(--gr);color:#1d2340}.cell.cur{background:var(--gd);color:#1d2340;animation:bn 1.4s infinite}
.mon{font-size:90px;text-align:center;animation:sh .6s infinite}@keyframes sh{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.cf{position:fixed;top:-30px;font-size:26px;z-index:12;pointer-events:none;animation:fl 1.8s forwards ease-in}
@keyframes fl{to{transform:translateY(110vh) rotate(540deg);opacity:.2}}
.wgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
@media(min-width:460px){.wgrid{grid-template-columns:repeat(8,1fr)}}
.wcup{border:3px solid var(--tx);border-radius:14px;padding:8px 4px;text-align:center;cursor:pointer;background:var(--cd);user-select:none;transition:transform .1s}
.wcup.on{background:var(--sk);color:#1d2340;box-shadow:0 3px 0 var(--tx)}
.daytabs{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:10px 0}
.daytab{padding:6px 2px;border-radius:12px;font-size:12px;box-shadow:0 2px 0 var(--tx);background:var(--cd)}
.daytab.on{background:var(--gd);color:#1d2340}
.daytab.done{background:var(--gr);color:#1d2340}
.gage-box{background:var(--gd);color:#1d2340;border:3px solid var(--tx);border-radius:18px;padding:12px;margin:10px 0;text-align:center;box-shadow:0 4px 0 var(--tx)}
@media(prefers-reduced-motion:reduce){.av,.cell.cur,.mon,.cf{animation:none}}
</style>
</head>
<body>
<div id="t"></div>
<main id="app"></main>
<div id="m"></div>
<nav id="nav"></nav>

<script>
// --- CLÉ DE SAUVEGARDE & OUTILS ---
const K = 'aubin_v2';
const $ = s => document.querySelector(s);
let S = null;
try { S = JSON.parse(localStorage.getItem(K)); } catch (e) {}
const save = () => { try { localStorage.setItem(K, JSON.stringify(S)); } catch (e) {} };
const dk = (d = new Date()) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const rnd = a => a[Math.floor(Math.random() * a.length)];

// --- DONNÉES DE BASE D'AUBIN ---
const TR = ['Fatigue', 'Stress', 'Ennui', 'Solitude', 'Dispute', 'Apéro', 'Habitude', 'Fête'];
const STG = [
  [0, '🥚', 'Œuf'],
  [1, '🐣', 'Poussin'],
  [3, '🐥', 'Petit courageux'],
  [7, '🦊', 'Renard malin'],
  [14, '🦁', 'Lion'],
  [30, '🐉', 'Dragon'],
  [90, '🦄', 'Licorne légendaire']
];
const DEFI = [
  'Envoie un selfie-sourire à un ami',
  'Prépare un mocktail (menthe, citron vert, eau pétillante)',
  'Écoute ta chanson préférée à fond',
  'Range un tiroir : 5 minutes chrono',
  'Dis merci à quelqu’un, en vrai',
  'Fais 10 pompes ou 15 squats',
  'Sors regarder le ciel 3 minutes',
  'Cuisine un truc que tu n’as jamais fait',
  'Écris 3 choses dont tu es fier',
  'Fais une danse ridicule de 30 secondes'
];
const ITEMS = [
  ['h1', '🎩', 'Chapeau', 50, 'hat'],
  ['h2', '👑', 'Couronne', 200, 'hat'],
  ['h3', '🎀', 'Ruban', 60, 'hat'],
  ['f1', '🕶️', 'Lunettes', 80, 'fc'],
  ['f2', '🎧', 'Casque', 100, 'fc'],
  ['f3', '🥸', 'Déguisement', 120, 'fc']
];
const MOCK = [
  '🍹 Mojito royal : eau pétillante bien fraîche, 1/2 citron vert pressé, feuilles de menthe froissées, 1 c.à.c de miel ou sirop d’agave et glaçons pilés.',
  '🔥 Ginger kick : ginger beer sans alcool (ou eau gazeuse + gingembre frais râpé), rondelle d’orange et brin de romarin pour le hit en gorge.',
  '💎 Spritz rubis détox : 1/3 jus de grenade ou cranberry pur, 2/3 eau pétillante et 1 rondelle de pamplemousse dans un grand verre à pied.',
  '🍏 Pomme-Basilic Zen : jus de pomme trouble, 3 feuilles de basilic frais tapées dans la main, trait de citron et eau gazeuse.'
];
const DETOX_MEALS = [
  ['🌅 Matin Énergie Stable', 'Flocons d’avoine ou pain complet + œufs ou purée d’amande + 1 grand verre d’eau citronnée pour réveiller le foie sans pic de sucre.'],
  ['🥗 Midi Super-Foie', 'Protéine légère (poulet, poisson, lentilles) + légumes verts (brocoli, roquette, artichaut, radis noir) + huile d’olive et curcuma.'],
  ['🌙 Soir Anti-Tentation (18h30)', 'Poignée d’amandes + 2 carrés de chocolat noir 70% (magnésium naturel contre l’envie d’apéro) + ton Mocktail frais !']
];
const GAGES = [
  ['💧', 'La Tornade d’Eau Fraîche', 'Bois 2 grands verres d’eau cul sec en faisant une grimace de pirate. Ton cerveau réclame de l’eau, pas de la culpabilité !'],
  ['🦵', 'Les 15 Squats du Pardon', 'Fais 15 squats (ou 10 pompes contre le mur) en souriant. On transforme l’écart en cuisses d’acier !'],
  ['🧦', 'Mission Tiroir Éclair (3 min)', 'Range un tiroir, une table ou ton sac pendant 3 minutes chrono. Esprit rangé = zéro honte !'],
  ['🥣', 'Le Cadeau au Toi de Demain', 'Prépare dès maintenant ta tasse, ton petit-déj ou ta bouteille d’eau pour demain matin.'],
  ['💌', 'Le Message Complice', 'Envoie un message gentil ou un emoji rigolo à un proche. Le lien humain bat toujours la culpabilité !'],
  ['🕺', 'Le Shake de Décompression', 'Secoue tes bras et tes épaules pendant 30 secondes comme un chien qui sort de l’eau pour lâcher la pression !']
];
const ACT = [
  ['🌬️', '3 grandes respirations (inspire 4 s, expire 6 s)'],
  ['💧', 'Boire un grand verre d’eau'],
  ['👀', '5-4-3-2-1 : nomme 5 choses que tu vois'],
  ['🚶', 'Bouger 2 minutes'],
  ['📱', 'Écrire un mot à quelqu’un'],
  ['❤️', 'Relire ta raison']
];
const HEALTH = [
  [24, '24 h', 'L’alcool a quitté ton sang. Si tu bois beaucoup chaque jour, un suivi médical compte énormément à ce stade.'],
  [72, '3 jours', 'Le sevrage physique est en général à son maximum entre 24 et 72 h. Reste entouré.'],
  [168, '1 semaine', 'Beaucoup de personnes dorment mieux et se réveillent moins vaseuses.'],
  [336, '2 semaines', 'Digestion, hydratation et énergie s’améliorent souvent.'],
  [720, '1 mois', 'La graisse du foie diminue souvent nettement en quelques semaines.'],
  [2160, '3 mois', 'Humeur, tension et mémoire progressent chez beaucoup de personnes.']
];
const TROPH = [
  ['🌅', 'Jour 1', s => s.days >= 1],
  ['🛡️', '3 jours', s => s.days >= 3],
  ['🏆', '7 jours', s => s.days >= 7],
  ['🌳', '14 jours', s => s.days >= 14],
  ['🐉', '30 jours', s => s.days >= 30],
  ['⚔️', '5 monstres vaincus', s => S.cr.filter(c => c.ok).length >= 5],
  ['🌙', '7 bilans du soir', s => Object.values(S.logs).filter(l => l.chk).length >= 7],
  ['💙', 'Honnête après un écart', s => S.slips >= 1],
  ['🎲', 'Gage déculpabilisant validé', s => (S.gagesDone || 0) >= 1]
];

let tab = 'home', B = null, bt = null, cur = { tr: null, md: 3, gageIdx: 0, gageDone: false };
let occT = null, spT = null, spLeft = null, selDayIdx = new Date().getDay();

const R = () => [
  ['eau', '💧', 'Boire 8 verres d’eau (' + (T().water || 0) + '/8)', 30],
  ['mov', '💪', 'Mon sport du jour (onglet Sport)', 40],
  ['rep', '🍽️', 'Faire un vrai repas détox', 30],
  ['soc', '📞', 'Parler à quelqu’un de confiance', 40],
  ['def', '🎲', 'Défi surprise : ' + DEFI[new Date().getDate() % DEFI.length], 50],
  ['chk', '🌙', 'Bilan du soir & Thérapie Aubin', 50]
];

const T = () => S.logs[dk()] || (S.logs[dk()] = { d: [], water: 0 });
const stat = () => {
  const raw = Date.now() - S.start, ms = Math.max(0, raw), h = ms / 36e5;
  const soberDays = Object.values(S.logs).filter(l => l.drank === false).length;
  const totalActiveDays = Math.max(Math.floor(h / 24), soberDays);
  return {
    pre: raw < 0,
    left: -raw,
    ms,
    h,
    days: Math.floor(h / 24),
    sober: soberDays,
    saved: (ms / 864e5) * S.cost,
    kcalSaved: Math.round(totalActiveDays * 300), // ~2 verres évités/j = 300 kcal vides
    sugarsSaved: Math.round(totalActiveDays * 7), // ~7 morceaux de sucre métaboliques/j
    croissantsSaved: (totalActiveDays * 300 / 280).toFixed(1)
  };
};
const stage = d => [...STG].reverse().find(s => d >= s[0]);

function toast(m) {
  const t = $('#t');
  t.textContent = m;
  t.style.display = 'block';
  clearTimeout(toast.i);
  toast.i = setTimeout(() => t.style.display = 'none', 3200);
}
function boom() {
  for (let i = 0; i < 26; i++) {
    const e = document.createElement('div');
    e.className = 'cf';
    e.textContent = rnd(['🎉', '⭐', '🪙', '✨', '🎊']);
    e.style.left = Math.random() * 95 + 'vw';
    e.style.animationDelay = Math.random() * .5 + 's';
    document.body.appendChild(e);
    setTimeout(() => e.remove(), 2500);
  }
}
function xp(n, m) {
  S.xp += n;
  S.gold += Math.round(n / 4);
  save();
  toast('+' + n + ' XP · +' + Math.round(n / 4) + ' 🪙 · ' + m);
  render();
}
function modal(h) {
  $('#m').innerHTML = '<div role="dialog">' + h + '</div>';
  $('#m').style.display = 'flex';
}
function close() {
  clearInterval(occT);
  $('#m').style.display = 'none';
  render();
}
function avatar() {
  const s = stat(), st = stage(s.days), w = S.worn || {};
  const it = id => ITEMS.find(i => i[0] == id)?.[1] || '';
  return `<div class="av" data-a="talk" title="Clique sur Aubin !">${st[1]}${w.hat ? `<span class="hat">${it(w.hat)}</span>` : ''}${w.fc ? `<span class="fc">${it(w.fc)}</span>` : ''}</div>`;
}
function say() {
  const s = stat(), t = T(), n = t.d.length, L = [];
  if (n == 0) L.push('Salut ' + (S.name || 'toi') + ' ! Un petit rituel ou un verre d’eau pour démarrer ?');
  if (n >= 3) L.push('Tu es en feu aujourd’hui 🔥');
  if (s.days >= 3) L.push(s.days + ' jours d’affilée… tu me rends tellement fier !');
  if ((t.water || 0) >= 8) L.push('8 verres d’eau bus aujourd’hui ! Ton foie danse la samba 💧');
  L.push(
    'Une envie ? Appelle-moi, on bat le monstre ensemble.',
    'Je ne te juge jamais. Même si tu trébuches, on tire un petit gage rigolo et on repart !',
    'Un jour à la fois, c’est tout ce qu’on demande.',
    'Viens me parler dans l’onglet Parler ce soir pour notre bilan IA 💙',
    'Tape-moi dessus, ça porte bonheur 😄'
  );
  return rnd(L);
}

function render() {
  if (!S) {
    $('#nav').style.display = 'none';
    return $('#app').innerHTML = onboard();
  }
  $('#nav').style.display = 'flex';
  $('#nav').innerHTML = [
    ['home', '🏠', 'Aubin'],
    ['map', '🗺️', 'Aventure'],
    ['sos', '⚔️', 'Envie !'],
    ['shop', '🛍️', 'Boutique'],
    ['sport', '💪', 'Sport/Détox'],
    ['talk', '💬', 'Parler IA'],
    ['me', '🧭', 'Moi']
  ].map(n => `<button class="${tab == n[0] ? 'on' : ''}" data-a="tab" data-v="${n[0]}"><span>${n[1]}</span>${n[2]}</button>`).join('');
  $('#app').innerHTML = { home, map, sos, shop, sport, talk, me }[tab]();
}

function onboard() {
  return `<div class="c hero"><div class="av" style="animation-duration:1.4s">🥚</div><h1>Aubin, le jeu qui t’aide à tenir</h1><p>Fais éclore ton compagnon, bats les monstres d’envie, fais ton sport sobre et discute avec Aubin chaque soir. Un jour à la fois, sans culpabilité.</p></div>
<div class="c"><label>Ton prénom</label><input id="nm" placeholder="Ex : Julien">
<p class="mu">Pas besoin de compter tes verres au centilitre près : ça change selon les jours (stress, réconfort, joie…) et c’est normal.</p><label>Dépense moyenne par semaine, à la louche (€, facultatif)</label><input id="co" type="number" min="0" placeholder="Ex : 35 (Laisse vide si tu ne sais pas)">
<label>Ta raison d’arrêter</label><textarea id="rs" rows="2" placeholder="Ex : être en pleine forme, être là pour mes proches"></textarea>
<label>💌 Message d’un proche (facultatif)</label><textarea id="ms" rows="2" placeholder="Ex : Je crois en toi. Je suis là."></textarea>
<label>📅 Ma date d’arrêt (aujourd’hui, bientôt, ou déjà passée)</label><input id="qd" type="date" value="${dk()}">
<div class="warn"><b>Sécurité d’abord.</b> Chez une personne dépendante, arrêter brutalement peut être dangereux. Coche ce qui est déjà arrivé :
<label style="font-weight:400"><input type="checkbox" class="sx" style="width:auto"> Tremblements, sueurs ou nausées quand je n’ai pas bu</label>
<label style="font-weight:400"><input type="checkbox" class="sx" style="width:auto"> Je bois dès le matin</label>
<label style="font-weight:400"><input type="checkbox" class="sx" style="width:auto"> Convulsions ou hallucinations lors d’un arrêt passé</label>
<div id="wr" style="display:none;margin-top:8px"><b>N’arrête pas d’un coup tout seul·e.</b> Parle d’abord à ton médecin ou appelle <a href="tel:0980980930">Alcool Info Service 09 80 98 09 30</a> (7j/7). Malaise : <a href="tel:15">15</a> ou <a href="tel:112">112</a>. Aubin t’accompagne en plus de ce suivi.</div></div>
<button class="f w" data-a="start">🐣 Faire éclore mon compagnon</button>
<p class="mu">Données stockées sur cet appareil. Ne remplace pas un suivi médical.</p></div>`;
}

function home() {
  const s = stat(), st = stage(s.days), L = Math.floor(S.xp / 200) + 1, t = T(), rit = R(), dn = rit.filter(r => t.d.includes(r[0])).length, all = dn == rit.length;
  return `${s.pre ? `<div class="c" style="background:var(--gd);color:#1d2340"><h3>📅 Jour J dans ${Math.ceil(s.left / 864e5)} jour${s.left > 864e5 * 1.01 ? 's' : ''}</h3><p>Tu arrêtes le ${new Date(S.start).toLocaleDateString('fr-FR')}. D’ici là : parle à ton médecin (surtout si tu bois beaucoup), préviens un proche, prépare tes occupations et tes mocktails. Tu peux déjà jouer et écrire ici.</p></div>` : ''}
<div class="row" style="margin-bottom:10px"><b>Niv. ${L}</b><b>🔥 ${s.days} j</b><b>🪙 ${S.gold}</b><b>🛡️ ${S.shield}</b></div>
<div class="c hero"><div class="mu">${st[2]}</div>${avatar()}<br><div class="say" id="say">${esc(say())}</div><div class="bar" style="margin:12px 0 4px"><i style="width:${(S.xp % 200) / 2}%"></i></div><div class="mu">${S.xp % 200}/200 XP vers le niveau ${L + 1}</div></div>
${S.msg ? `<div class="c" style="background:var(--gd);color:#1d2340">💌 <b>Message de ton proche</b><br>${esc(S.msg)}</div>` : ''}
<div class="g">${S.cost > 0 ? `<div class="c"><b style="font-size:22px">${s.saved.toFixed(0)} €</b><div class="mu">économisés (estimation)</div></div>` : `<div class="c"><b style="font-size:22px">${Math.floor(s.h)} h</b><div class="mu">sans alcool</div></div>`}<div class="c"><b style="font-size:22px">${s.sober}</b><div class="mu">jours sobres au total (jamais effacés)</div></div></div>
<div class="c"><div class="row"><h3>Mes quêtes du jour</h3><span class="mu">${dn}/${rit.length}</span></div>
${rit.map(r => `<div class="ritual ${t.d.includes(r[0]) ? 'd' : ''}" data-a="rit" data-v="${r[0]}"><span>${r[1]} ${esc(r[2])}</span><b style="margin-left:auto">+${r[3]}</b></div>`).join('')}
${all && !t.chest ? '<button class="f w" data-a="chest">🎁 Ouvrir mon coffre du jour !</button>' : all ? '<p class="mu">Coffre ouvert. À demain pour le suivant !</p>' : '<p class="mu">Termine toutes les quêtes pour gagner un coffre surprise.</p>'}</div>

async function callGeminiAubin(userPrompt, mode = 'comfort') {
  const apiKey = "";
  const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
  const s = stat();
  const sysInstruction = mode === 'mocktail'
    ? `Tu es Aubin, le petit compagnon mascotte joyeux et malin d'une application d'arrêt de l'alcool. Propose en français (3 à 4 phrases max, ton enthousiaste et gourmand) une recette minute de mocktail festif sans alcool OU une astuce anti-fringale de 19h avec ce qu'on a dans son frigo.`
    : `Tu es Aubin (${stage(s.days)[1]} ${stage(s.days)[2]}), le meilleur ami et compagnon chaleureux, drôle et ultra-bienveillant d'une personne qui arrête ou réduit l'alcool (${s.days} jours de série actuelle, ${s.sober} jours sobres cumulés, prénom: ${S.name || 'mon ami'}). Réponds en français, en tutoyant, en 3 à 5 phrases simples et chaleureuses. Reflète ce que la personne ressent, dédramatise totalement la culpabilité, valorise un petit pas concret (boire de l'eau, faire 5 min d'occupation, tirer un petit gage rigolo si elle a fait un écart). Ne moralise jamais, ne donne pas de conseil médical précis. Si elle évoque des idées suicidaires, des tremblements forts ou un malaise, dis-lui d'appeler tout de suite le 3114 ou le 15/112.`;

  const payload = {
    contents: [{ parts: [{ text: userPrompt }] }],
    systemInstruction: { parts: [{ text: sysInstruction }] }
  };

  for (let attempt = 0; attempt < 3; attempt++) {
    try {
      const res = await fetch(apiUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      const txt = data?.candidates?.[0]?.content?.parts?.[0]?.text;
      if (txt && txt.trim()) return txt.trim();
    } catch (e) {
      if (attempt < 2) await new Promise(r => setTimeout(r, 1000 * Math.pow(2, attempt)));
    }
  }
  return null;
}

<button class="f w" data-a="sum">📋 Copier un résumé pour mon médecin</button><button class="f s" style="margin-top:10px" data-a="reset">Tout effacer</button>`;
}

// --- MODALE "J'AI BU / J'AI DÉCONNÉ" AVEC ROUE DE GAGE DÉCULPABILISANT ---
function slip() {
  clearInterval(bt);
  cur.gageIdx = Math.floor(Math.random() * GAGES.length);
  cur.gageDone = false;
  renderSlipModal();
}

function renderSlipModal() {
  const g = GAGES[cur.gageIdx];
  modal(`<h2>Merci d’être honnête 💙</h2><p>Ici, zéro honte ! Un écart n’efface ni tes jours sobres cumulés, ni ton compagnon. Pour que ton cerveau ne culpabilise pas, tire un <b>petit gage rigolo</b> pour payer ta dette à Aubin !</p>
<div class="gage-box" id="gagebox">
  <div style="font-size:38px">${g[0]}</div>
  <b>Gage complice : ${g[1]}</b>
  <p style="margin:6px 0;font-size:14px">${g[2]}</p>
  <div class="g" style="margin-top:8px">
    <button class="s" data-a="rerollgage">🎲 Autre gage</button>
    <button class="${cur.gageDone ? 's' : ''}" data-a="donegage" ${cur.gageDone ? 'disabled' : ''}>${cur.gageDone ? '✅ Gage validé (+40 XP)' : '🎯 Je fais ce gage (+40 XP)'}</button>
  </div>
</div>
<div class="warn">Si tu bois beaucoup au quotidien, ne coupe pas d’un coup sans avis médical. Tremblements, malaise ou confusion : <a href="tel:15">15</a>.</div>
<label>Quel a été le déclencheur ?</label><div style="display:flex;flex-wrap:wrap;gap:6px">${TR.map(t => `<button class="chip ${cur.tr == t ? 'on' : ''}" data-a="tr" data-v="${t}">${t}</button>`).join('')}</div>
<label>Combien as-tu bu ? <span class="mu">(facultatif, juste pour toi)</span></label><div style="display:flex;flex-wrap:wrap;gap:6px">${['Un peu', 'Pas mal', 'Beaucoup', 'Je ne sais pas'].map(a => `<button class="chip ${cur.amt == a ? 'on' : ''}" data-a="amt" data-v="${a}">${a}</button>`).join('')}</div>
${S.shield > 0 ? '<button class="f w" style="margin-top:10px" data-a="slipok" data-v="1">🛡️ Utiliser mon bouclier : ma série est sauvée</button>' : ''}
<button class="f s" style="margin-top:8px" data-a="slipok" data-v="0">Je repars de jour 0, avec mes acquis (+30 XP)</button><button class="f s" style="margin-top:8px" data-a="close">Annuler</button>`);
}

// --- ACTIONS INTERACTIVES ---
const A = {
  tab(v) { tab = v; render(); },
  close,
  slip,
  start() {
    S = {
      name: $('#nm').value.trim(),
      cost: (+$('#co').value || 0) / 7,
      habits: [],
      notes: [],
      lvl: 'doux',
      start: qdate(),
      best: 0,
      xp: 0,
      gold: 20,
      logs: {},
      cr: [],
      slips: 0,
      gagesDone: 0,
      shield: 1,
      items: [],
      worn: {},
      reasons: $('#rs').value.trim() ? [$('#rs').value.trim()] : [],
      contacts: [],
      msg: $('#ms').value.trim(),
      lastSh: 0
    };
    T().drank = false;
    save();
    boom();
    render();
    toast('Ton œuf commence à trembler 🥚');
  },
  talk() {
    const e = $('#say');
    if (e) e.textContent = say();
  },
  rit(v) {
    const t = T();
    if (t.d.includes(v)) return;
    if (v == 'chk') return chkModal();
    if (v == 'mov' && !t.sport) { tab = 'sport'; return render(); }
    if (v == 'eau') { t.water = 8; }
    t.d.push(v);
    xp(R().find(r => r[0] == v)[3], 'bien joué');
  },
  water(v) {
    const t = T();
    const num = +v;
    t.water = t.water === num ? num - 1 : num;
    if (t.water >= 8 && !t.d.includes('eau')) {
      t.d.push('eau');
      boom();
      xp(30, '8 verres d’eau bus ! Quête validée 💧');
      return;
    }
    save();
    toast('💧 Hydratation : ' + t.water + '/8 verres d’eau');
    render();
  },
  selday(v) {
    selDayIdx = +v;
    spLeft = null;
    clearInterval(spT);
    spT = null;
    render();
  },
  mockmodal() {
    modal(`<h2>🍹 Le Bar à Mocktails d’Aubin</h2><p class="mu">Le plaisir visuel et festif de l’apéro, avec 0% de gueule de bois demain matin :</p>
    ${MOCK.map(m => `<div class="c" style="margin-bottom:8px">${m}</div>`).join('')}
    <button class="f w" data-a="close">Miam, je teste ça !</button>`);
  },
  rerollgage() {
    cur.gageIdx = (cur.gageIdx + 1) % GAGES.length;
    renderSlipModal();
  },
  donegage() {
    if (cur.gageDone) return;
    cur.gageDone = true;
    S.gagesDone = (S.gagesDone || 0) + 1;
    T().gage = GAGES[cur.gageIdx][1];
    S.xp += 40;
    S.gold += 10;
    save();
    boom();
    toast('🎯 Gage validé ! +40 XP & culpabilité envolée !');
    renderSlipModal();
  },
  chkModal() { chkModal(); },
  md(v, el) {
    cur.md = +v;
    el.parentNode.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c == el));
  },
  async chkok() {
    const t = T();
    const noteTxt = $('#nt').value.trim();
    t.mood = cur.md;
    t.note = noteTxt;
    t.chk = true;
    if (t.drank !== true) t.drank = false;
    if (!t.d.includes('chk')) t.d.push('chk');
    close();
    xp(50, 'bilan du soir validé 🌙');
    if (noteTxt) {
      tk = { r: '', c: CR.test(noteTxt), l: true };
      const r = await comfort(`Bilan du soir (humeur ${cur.md}/5) : ${noteTxt}`);
      S.notes.push({ k: dk(), t: '🌙 Bilan : ' + noteTxt, r });
      tk = { r, c: CR.test(noteTxt), l: false };
      save();
      render();
    }
  },
  chest() {
    const t = T();
    t.chest = 1;
    const r = Math.random();
    let h;
    if (r < .4) {
      const g = 30 + Math.floor(Math.random() * 40);
      S.gold += g;
      h = `<div class="mon">🪙</div><h2>+${g} pièces !</h2>`;
    } else if (r < .7) {
      S.xp += 90;
      h = '<div class="mon">⚡</div><h2>+90 XP !</h2>';
    } else {
      S.gold += 20;
      h = `<div class="mon">🍹</div><h2>Recette secrète</h2><p>${rnd(MOCK)}</p><p class="mu">+20 🪙</p>`;
    }
    save();
    boom();
    modal(h + '<button class="f w" data-a="close">Trop bien</button>');
  },
  amt(v, el) {
    cur.amt = v;
    el.parentNode.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c == el));
  },
  cday(v) { cs = v; render(); },
  setdate() {
    const v = $('#nd').value;
    if (!v) return;
    S.start = v == dk() ? Date.now() : new Date(v + 'T00:00:00').getTime();
    save();
    toast('Date d’arrêt enregistrée');
    render();
  },
  qprompt(v) {
    const tx = $('#tx');
    if (tx) { tx.value = v; tx.focus(); }
  },
  note() {
    const t = ($('#tx').value || '').trim();
    if (!t) return toast('Écris quelques mots d’abord');
    S.notes.push({ k: dk(), t, r: '' });
    tk = { r: '', c: CR.test(t), l: false };
    xp(20, 'tu t’es exprimé·e');
  },
  async comf() {
    const t = ($('#tx').value || '').trim();
    if (!t) return toast('Écris ou choisis une bulle d’abord');
    tk = { r: '', c: CR.test(t), l: true };
    render();
    const r = await comfort(t, 'comfort');
    S.notes.push({ k: dk(), t, r });
    tk = { r, c: CR.test(t), l: false };
    xp(30, 'Aubin t’a répondu 💙');
  },
  async aiidea() {
    const userHint = ($('#tx')?.value || '').trim() || 'Donne-moi une super recette de mocktail ou une astuce anti-tentation pour ce soir !';
    tk = { r: '', c: false, l: true };
    render();
    const r = await comfort(userHint, 'mocktail');
    tk = { r, c: false, l: false };
    xp(20, 'idée fraîche d’Aubin 🍹');
  },
  mic() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return toast('Dictée indisponible ici : utilise le micro de ton clavier 🎤');
    if (rec) { rec.stop(); return; }
    rec = new SR();
    rec.lang = 'fr-FR';
    rec.onresult = e => {
      const x = $('#tx');
      if (x) x.value += (x.value ? ' ' : '') + e.results[e.results.length - 1][0].transcript;
    };
    rec.onend = () => {
      rec = null;
      const b = $('#mic');
      if (b) b.textContent = '🎤 Parler';
    };
    rec.onerror = () => toast('Micro refusé ou indisponible');
    try {
      rec.start();
      $('#mic').textContent = '⏹ Stop';
    } catch (e) { rec = null; }
  },
  lvl(v) {
    S.lvl = v;
    spLeft = null;
    clearInterval(spT);
    spT = null;
    save();
    render();
  },
  spt() {
    if (spT) { clearInterval(spT); spT = null; return render(); }
    const x = SP[S.lvl][selDayIdx];
    if (spLeft == null) spLeft = x[3] * 60;
    spT = setInterval(() => {
      spLeft = Math.max(0, spLeft - 1);
      const e = $('#spc');
      if (e) e.textContent = fmt(spLeft);
      if (!spLeft) {
        clearInterval(spT);
        spT = null;
        toast('Temps écoulé, bravo !');
      }
    }, 1000);
    render();
  },
  sportok() {
    const t = T();
    t.sport = 1;
    if (!t.d.includes('mov')) t.d.push('mov');
    clearInterval(spT);
    spT = null;
    spLeft = null;
    boom();
    xp(60, 'sport du jour validé !');
  },
  occ(v) {
    const p = v == 'r' ? [Math.floor(Math.random() * 4), Math.floor(Math.random() * 4)] : v.split('-').map(Number);
    const i = p[0], j = p[1];
    let sec = 300;
    modal(`<h2>${OCC[i][0]}</h2><h3 style="text-align:center">${OCC[i][j + 1]}</h3><div id="ot" style="text-align:center;font-size:40px;font-weight:700">05:00</div><p class="mu" style="text-align:center">Concentre-toi juste sur ça pendant 5 minutes. L’envie va baisser.</p><button class="f w" data-a="occok">J’ai fait ça (+25 XP)</button><button class="f s" style="margin-top:8px" data-a="occ" data-v="r">Autre idée</button><button class="f s" style="margin-top:8px" data-a="close">Fermer</button>`);
    clearInterval(occT);
    occT = setInterval(() => {
      sec = Math.max(0, sec - 1);
      const e = $('#ot');
      if (e) e.textContent = fmt(sec);
    }, 1000);
  },
  occok() {
    clearInterval(occT);
    if (B) {
      B.hp = Math.max(0, B.hp - 20);
      if (B.hp <= 0) { S.xp += 25; save(); return A.win(); }
    }
    close();
    xp(25, 'bien occupé !');
  },
  addh() {
    const w = $('#hw').value.trim(), t = $('#ht').value.trim();
    if (w && t) { S.habits.push({ w, t }); save(); render(); }
  },
  delh(v) { S.habits.splice(+v, 1); save(); render(); },
  hab(v) {
    const t = T();
    t.h = t.h || [];
    if (t.h.includes(+v)) return;
    t.h.push(+v);
    xp(30, 'habitude remplacée !');
  },
  tr(v, el) {
    cur.tr = v;
    el.parentNode.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c == el));
  },
  fight() {
    B = { hp: 100, used: [] };
    bt = setInterval(() => {
      if (!B) return;
      B.hp = Math.max(0, B.hp - 1);
      const e = $('#hp');
      if (e) e.style.width = B.hp + '%';
      if (B.hp <= 0) A.win();
    }, 6000);
    render();
  },
  hit(v) {
    if (!B || B.used.includes(+v)) return;
    B.used.push(+v);
    B.hp = Math.max(0, B.hp - 20);
    if (B.hp <= 0) A.win();
    else render();
  },
  win() {
    clearInterval(bt);
    B = null;
    S.cr.push({ tr: cur.tr, ok: true });
    cur.tr = null;
    boom();
    xp(60, 'monstre vaincu !');
    modal('<div class="mon">🏆</div><h2>Monstre vaincu !</h2><p>L’envie est retombée, et c’est toi qui l’as fait. +60 XP.</p><button class="f w" data-a="close">Je suis un boss</button>');
  },
  slipok(v) {
    const s = stat(), t = T();
    t.drank = true;
    t.amt = cur.amt || null;
    cur.amt = null;
    S.cr.push({ tr: cur.tr, ok: false });
    cur.tr = null;
    S.slips++;
    B = null;
    if (v == '1') {
      S.shield--;
      toast('Bouclier utilisé : série sauvée 🛡️');
    } else {
      S.best = Math.max(S.best, s.days);
      S.start = Date.now();
      S.xp += 30;
    }
    save();
    close();
  },
  buy(v) {
    const i = ITEMS.find(x => x[0] == v);
    if (!S.items.includes(v)) {
      if (S.gold < i[3]) return toast('Pas assez de pièces… continue tes quêtes !');
      S.gold -= i[3];
      S.items.push(v);
      boom();
    }
    S.worn[i[4]] = S.worn[i[4]] == v ? null : v;
    save();
    render();
  },
  addr() {
    const v = $('#nr').value.trim();
    if (v) { S.reasons.push(v); save(); render(); }
  },
  delr(v) { S.reasons.splice(+v, 1); save(); render(); },
  addc() {
    const n = $('#cn').value.trim(), t = $('#ct').value.trim();
    if (n && t) { S.contacts.push({ n, t }); save(); render(); }
  },
  delc(v) { S.contacts.splice(+v, 1); save(); render(); },
  sum() {
    const s = stat();
    const x = `Suivi Aubin : ${s.sober} jours sobres au total, série en cours ${s.days} j, ${S.slips} écart(s), ${S.cr.filter(c => c.ok).length} envie(s) surmontée(s).`;
    try {
      const ta = document.createElement('textarea');
      ta.value = x;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
      toast('📋 Résumé copié dans le presse-papiers !');
    } catch (e) { toast(x); }
  },
  reset() {
    modal('<h2>Tout effacer ?</h2><p>Compagnon, XP et pièces seront supprimés de cet appareil.</p><button class="r f" data-a="reset2">Oui, effacer</button><button class="s f" style="margin-top:8px" data-a="close">Annuler</button>');
  },
  reset2() {
    try { localStorage.removeItem(K); } catch (e) {}
    S = null;
    close();
  }
};

function chkModal() {
  modal(`<h2>Bilan du soir & Thérapie Aubin 🌙</h2><label>Mon humeur aujourd’hui</label><div style="display:flex;gap:8px;justify-content:center">${[1, 2, 3, 4, 5].map(i => `<button class="chip ${i == 3 ? 'on' : ''}" data-a="md" data-v="${i}">${['😞', '😕', '😐', '🙂', '😄'][i - 1]}</button>`).join('')}</div><label>Un mot sur ma journée (Aubin te répondra dans Parler IA)</label><input id="nt" placeholder="Une victoire, une difficulté, une fierté…"><button class="f w" style="margin-top:14px" data-a="chkok">Valider mon bilan (+50 XP)</button><button class="s f" style="margin-top:8px" data-a="close">Plus tard</button>`);
}

document.addEventListener('click', e => {
  const a = e.target.closest('[data-a]');
  if (a && A[a.dataset.a]) A[a.dataset.a](a.dataset.v, a);
});
document.addEventListener('change', e => {
  if (e.target.classList.contains('sx')) {
    $('#wr').style.display = [...document.querySelectorAll('.sx')].some(c => c.checked) ? 'block' : 'none';
  }
});

if (S) {
  S.habits = S.habits || [];
  S.notes = S.notes || [];
  S.lvl = S.lvl || 'doux';
  S.gagesDone = S.gagesDone || 0;
  const s = stat(), g = Math.floor(s.days / 7);
  if (g > (S.lastSh || 0)) {
    S.shield = Math.min(2, S.shield + g - (S.lastSh || 0));
    S.lastSh = g;
    save();
  }
}
render();
</script>
</body>
</html>
